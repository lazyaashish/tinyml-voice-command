; PlatformIO Project Configuration for ESP32 Keyword Spotting (KWS)
; Target Hardware: ESP32-WROOM-32 / ESP32-DevKitC / ESP32-S3

[platformio]
default_envs = esp32dev
src_dir = ../firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler optimization and include flags
build_flags =
    -O3
    -DCORE_DEBUG_LEVEL=0
    -I../model

; Serial monitor filters
monitor_filters =
    time
    esp32_exception_decoder

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -O3
    -DCORE_DEBUG_LEVEL=0
    -I../model
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_filters =
    time
    esp32_exception_decoder

