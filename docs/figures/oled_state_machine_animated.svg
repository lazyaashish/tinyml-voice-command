<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="oledBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000205" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>

    <filter id="oledGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Keyframes for 4 OLED display states over 16-second loop */
    @keyframes showStateBoot {
      0%, 20% { opacity: 1; visibility: visible; }
      24%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes showStateListening {
      0%, 22% { opacity: 0; visibility: hidden; }
      26%, 46% { opacity: 1; visibility: visible; }
      50%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes showStateDetectedGo {
      0%, 48% { opacity: 0; visibility: hidden; }
      52%, 72% { opacity: 1; visibility: visible; }
      76%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes showStateDetectedStop {
      0%, 74% { opacity: 0; visibility: hidden; }
      78%, 96% { opacity: 1; visibility: visible; }
      99%, 100% { opacity: 0; visibility: hidden; }
    }

    /* Live Animated VU meter bars inside listening phase */
    @keyframes oledVu1 { 0%, 100% { width: 14px; } 50% { width: 55px; } }
    @keyframes oledVu2 { 0%, 100% { width: 22px; } 50% { width: 92px; } }
    @keyframes oledVu3 { 0%, 100% { width: 18px; } 50% { width: 78px; } }

    .state-boot { animation: showStateBoot 16s ease-in-out infinite; }
    .state-listening { animation: showStateListening 16s ease-in-out infinite; }
    .state-detected-go { animation: showStateDetectedGo 16s ease-in-out infinite; }
    .state-detected-stop { animation: showStateDetectedStop 16s ease-in-out infinite; }

    .oled-vu-1 { animation: oledVu1 0.7s ease-in-out infinite; }
    .oled-vu-2 { animation: oledVu2 0.5s ease-in-out infinite 0.1s; }
    .oled-vu-3 { animation: oledVu3 0.6s ease-in-out infinite 0.2s; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="380" rx="16" fill="url(#oledBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(36, 30)">
    <text class="sans" x="0" y="0" font-size="18" font-weight="800" fill="#f8fafc">
      SSD1306 OLED REAL-TIME VISUAL STATE MACHINE
    </text>
    <text class="mono" x="0" y="20" font-size="11.5" fill="#94a3b8">
      128x64 Monochrome Pixel-Perfect Display Simulation • 12 FPS Dynamic Sound Meter • Autonomous Transitions
    </text>
  </g>

  <!-- Physical OLED Module Chassis (Center-Left) -->
  <g transform="translate(48, 75)">
    <!-- PCB Board -->
    <rect width="460" height="260" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="2" />

    <!-- 4 Mounting Screws -->
    <circle cx="20" cy="20" r="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="440" cy="20" r="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="20" cy="240" r="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="440" cy="240" r="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

    <!-- Pin Header Label at Top -->
    <g transform="translate(170, 16)">
      <text class="mono" x="0" y="0" font-size="9" fill="#64748b">GND  VCC  SCL  SDA</text>
      <circle cx="8" cy="8" r="2.5" fill="#e2e8f0" />
      <circle cx="32" cy="8" r="2.5" fill="#e2e8f0" />
      <circle cx="56" cy="8" r="2.5" fill="#e2e8f0" />
      <circle cx="80" cy="8" r="2.5" fill="#e2e8f0" />
    </g>

    <!-- Bezel Frame -->
    <rect x="30" y="38" width="400" height="200" rx="8" fill="url(#bezelGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Active OLED Glass Screen (128x64 scaled up) -->
    <rect x="42" y="50" width="376" height="176" rx="4" fill="url(#screenGrad)" stroke="#0284c7" stroke-width="1.5" filter="url(#oledGlow)" />

    <!-- ================= STATE 1: BOOT & CALIBRATION ================= -->
    <g class="state-boot" transform="translate(56, 68)">
      <text class="mono" x="0" y="18" font-size="14" font-weight="700" fill="#38bdf8">ESP32 TinyML KWS</text>
      <line x1="0" y1="28" x2="348" y2="28" stroke="#38bdf8" stroke-width="1.2" />
      <text class="mono" x="0" y="52" font-size="13" fill="#ffffff">Model: W76 (12 Classes)</text>
      <text class="mono" x="0" y="74" font-size="13" fill="#ffffff">Accuracy: 95.0% INT8</text>
      <text class="mono" x="0" y="96" font-size="13" fill="#ffffff">Heap Free: 238 KB</text>
      <text class="mono" x="0" y="122" font-size="12" fill="#10b981">Status: CALIBRATING NOISE...</text>
    </g>

    <!-- ================= STATE 2: LIVE LISTENING VU METER ================= -->
    <g class="state-listening" transform="translate(56, 68)">
      <text class="mono" x="0" y="18" font-size="13" font-weight="700" fill="#ffffff">KWS: W76 12-CLASS</text>
      <line x1="0" y1="28" x2="348" y2="28" stroke="#ffffff" stroke-width="1.2" />
      <text class="mono" x="0" y="54" font-size="15" font-weight="700" fill="#38bdf8">STATUS: [ LISTENING ]</text>
      
      <text class="mono" x="0" y="80" font-size="11" fill="#94a3b8">MIC SOUND LEVEL (RMS):</text>
      
      <!-- VU Bar Outer Box -->
      <rect x="0" y="92" width="348" height="24" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="4" y="96" width="90" height="16" rx="2" fill="#38bdf8" class="oled-vu-2" />
      <text class="mono" x="0" y="132" font-size="10.5" fill="#64748b">Idle CPU: 0.1% • Silence Gate Active</text>
    </g>

    <!-- ================= STATE 3: KEYWORD DETECTED "GO" ================= -->
    <g class="state-detected-go" transform="translate(56, 64)">
      <!-- High-Contrast Inverted Solid White Screen -->
      <rect x="-10" y="-10" width="368" height="168" rx="4" fill="#ffffff" />
      <text class="mono" x="6" y="18" font-size="13" font-weight="700" fill="#000000">CONFIDENCE: 97.2%</text>
      <text class="sans" x="6" y="74" font-size="52" font-weight="900" fill="#000000" letter-spacing="2">GO</text>
      <text class="mono" x="6" y="112" font-size="13" font-weight="600" fill="#000000">Latency: 3.51 ms @ 240MHz</text>
      <text class="mono" x="6" y="132" font-size="12" font-weight="700" fill="#000000">Action: MOTOR ON / RELAY HIGH</text>
    </g>

    <!-- ================= STATE 4: KEYWORD DETECTED "STOP" ================= -->
    <g class="state-detected-stop" transform="translate(56, 64)">
      <!-- High-Contrast Inverted Solid White Screen -->
      <rect x="-10" y="-10" width="368" height="168" rx="4" fill="#ffffff" />
      <text class="mono" x="6" y="18" font-size="13" font-weight="700" fill="#000000">CONFIDENCE: 96.4%</text>
      <text class="sans" x="6" y="74" font-size="46" font-weight="900" fill="#000000" letter-spacing="2">STOP</text>
      <text class="mono" x="6" y="112" font-size="13" font-weight="600" fill="#000000">Latency: 3.48 ms @ 240MHz</text>
      <text class="mono" x="6" y="132" font-size="12" font-weight="700" fill="#000000">Action: MOTOR HALTED / RELAY OFF</text>
    </g>
  </g>

  <!-- Explanatory State Steps (Right Column) -->
  <g transform="translate(540, 75)">
    <!-- Phase 1 -->
    <g transform="translate(0, 0)">
      <rect width="380" height="56" rx="8" fill="#131c2e" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="28" r="10" fill="#0369a1" />
      <text class="mono" x="20" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
      <text class="sans" x="40" y="22" font-size="12.5" font-weight="700" fill="#f8fafc">Boot &amp; Ambient Noise Calibration</text>
      <text class="mono" x="40" y="40" font-size="10" fill="#94a3b8">Profiles room background noise for 1.0s (RMS ~22)</text>
    </g>

    <!-- Phase 2 -->
    <g transform="translate(0, 68)">
      <rect width="380" height="56" rx="8" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="28" r="10" fill="#1e293b" />
      <text class="mono" x="20" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">2</text>
      <text class="sans" x="40" y="22" font-size="12.5" font-weight="700" fill="#f8fafc">Live Sound VU Visualizer (12 FPS)</text>
      <text class="mono" x="40" y="40" font-size="10" fill="#94a3b8">Visual confirmation of microphone health in real time</text>
    </g>

    <!-- Phase 3 -->
    <g transform="translate(0, 136)">
      <rect width="380" height="56" rx="8" fill="#131c2e" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="28" r="10" fill="#065f46" />
      <text class="mono" x="20" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
      <text class="sans" x="40" y="22" font-size="12.5" font-weight="700" fill="#34d399">Inverted High-Contrast Detection</text>
      <text class="mono" x="40" y="40" font-size="10" fill="#94a3b8">Displays keyword, confidence %, and 3.5 ms latency</text>
    </g>

    <!-- Phase 4 -->
    <g transform="translate(0, 204)">
      <rect width="380" height="56" rx="8" fill="#131c2e" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="20" cy="28" r="10" fill="#78350f" />
      <text class="mono" x="20" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
      <text class="sans" x="40" y="22" font-size="12.5" font-weight="700" fill="#fbbf24">Actuator Trigger &amp; 2s Auto-Revert</text>
      <text class="mono" x="40" y="40" font-size="10" fill="#94a3b8">Toggles GPIO 2/4 and smoothly reverts to LISTENING</text>
    </g>
  </g>
</svg>