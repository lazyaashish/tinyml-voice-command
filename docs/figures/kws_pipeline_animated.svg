<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#651fff" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00c853" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Animations */
    @keyframes pulseWire {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseVU1 { 0%, 100% { height: 6px; y: 48px; } 50% { height: 16px; y: 38px; } }
    @keyframes pulseVU2 { 0%, 100% { height: 12px; y: 42px; } 50% { height: 26px; y: 28px; } }
    @keyframes pulseVU3 { 0%, 100% { height: 18px; y: 36px; } 50% { height: 32px; y: 22px; } }
    @keyframes pulseVU4 { 0%, 100% { height: 10px; y: 44px; } 50% { height: 22px; y: 32px; } }
    @keyframes pulseVU5 { 0%, 100% { height: 15px; y: 39px; } 50% { height: 28px; y: 26px; } }

    @keyframes liveLed {
      0%, 100% { fill: #00e676; filter: drop-shadow(0 0 8px #00e676); }
      50% { fill: #00b0ff; filter: drop-shadow(0 0 4px #00b0ff); }
    }

    @keyframes soundWave {
      0% { r: 12px; opacity: 0.8; }
      100% { r: 32px; opacity: 0; }
    }

    .wire-active {
      stroke-dasharray: 6 4;
      animation: pulseWire 0.8s linear infinite;
    }

    .vu-bar-1 { animation: pulseVU1 0.7s ease-in-out infinite; }
    .vu-bar-2 { animation: pulseVU2 0.5s ease-in-out infinite 0.1s; }
    .vu-bar-3 { animation: pulseVU3 0.6s ease-in-out infinite 0.2s; }
    .vu-bar-4 { animation: pulseVU4 0.8s ease-in-out infinite 0.15s; }
    .vu-bar-5 { animation: pulseVU5 0.55s ease-in-out infinite 0.25s; }

    .led-glow { animation: liveLed 1.8s ease-in-out infinite; }
    .wave-pulse { animation: soundWave 1.4s ease-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="960" height="380" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Subtitle / Header -->
  <g transform="translate(32, 28)">
    <text class="sans" x="0" y="0" font-size="18" font-weight="700" fill="#f9fafb" letter-spacing="0.5">
      ESP32 AUTONOMOUS TINYML VOICE RECOGNITION PIPELINE
    </text>
    <text class="mono" x="0" y="20" font-size="12" fill="#9ca3af">
      100% On-Device Neural Execution • 95.0% Accuracy • Zero Cloud • 0.44% CPU Active Duty Cycle
    </text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(770, 22)">
    <rect width="158" height="26" rx="13" fill="#1e3a5f" stroke="#00e5ff" stroke-width="1" />
    <circle cx="16" cy="13" r="5" fill="#00e676" class="led-glow" />
    <text class="mono" x="28" y="17" font-size="11" font-weight="600" fill="#00e5ff">AUTONOMOUS EDGE</text>
  </g>

  <!-- ==================== 1. AUDIO INPUT STAGE ==================== -->
  <g transform="translate(32, 75)">
    <!-- Card Frame -->
    <rect width="180" height="265" rx="12" fill="url(#cardGrad)" stroke="#00e5ff" stroke-width="1.5" filter="url(#glowCyan)" />
    
    <!-- Stage Header -->
    <rect x="0" y="0" width="180" height="36" rx="12" fill="#0e7490" fill-opacity="0.25" />
    <text class="mono" x="12" y="22" font-size="12" font-weight="700" fill="#00e5ff">01 // AUDIO INGEST</text>

    <!-- Microphone Graphic -->
    <g transform="translate(90, 85)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00e5ff" stroke-width="1.5" class="wave-pulse" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#00e5ff" stroke-width="1.2" class="wave-pulse" style="animation-delay: 0.5s;" />
      <circle cx="0" cy="0" r="16" fill="#1f2937" stroke="#00e5ff" stroke-width="2" />
      <!-- Mic Icon -->
      <rect x="-4" y="-8" width="8" height="12" rx="4" fill="#00e5ff" />
      <path d="M -7 -2 A 7 7 0 0 0 7 -2" fill="none" stroke="#00e5ff" stroke-width="1.5" />
      <line x1="0" y1="5" x2="0" y2="10" stroke="#00e5ff" stroke-width="1.5" />
    </g>

    <!-- Component Info -->
    <text class="sans" x="90" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#f9fafb">INMP441 MEMS</text>
    <text class="mono" x="90" y="142" text-anchor="middle" font-size="11" fill="#9ca3af">I2S Digital Mic</text>

    <!-- Audio VU Meter (Live Animated) -->
    <g transform="translate(35, 155)">
      <rect x="0" y="0" width="110" height="56" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <rect x="15" y="40" width="10" height="12" rx="2" fill="#00e5ff" class="vu-bar-1" />
      <rect x="33" y="32" width="10" height="20" rx="2" fill="#00e5ff" class="vu-bar-2" />
      <rect x="51" y="24" width="10" height="28" rx="2" fill="#00e676" class="vu-bar-3" />
      <rect x="69" y="34" width="10" height="18" rx="2" fill="#00e5ff" class="vu-bar-4" />
      <rect x="87" y="28" width="10" height="24" rx="2" fill="#7c4dff" class="vu-bar-5" />
    </g>

    <!-- Specs -->
    <text class="mono" x="90" y="235" text-anchor="middle" font-size="10.5" fill="#38bdf8">16 kHz • 24-bit • Mono</text>
    <text class="mono" x="90" y="250" text-anchor="middle" font-size="10" fill="#6b7280">GPIO 26/25/33 (I2S DMA)</text>
  </g>

  <!-- Wire 1: Mic -> ESP32 DSP -->
  <path d="M 212 205 L 268 205" fill="none" stroke="#00e5ff" stroke-width="2" class="wire-active" />
  <polygon points="268,201 276,205 268,209" fill="#00e5ff" />

  <!-- ==================== 2. ON-CHIP DSP & VAD ==================== -->
  <g transform="translate(276, 75)">
    <rect width="190" height="265" rx="12" fill="url(#cardGrad)" stroke="#7c4dff" stroke-width="1.5" />
    
    <rect x="0" y="0" width="190" height="36" rx="12" fill="#581c87" fill-opacity="0.3" />
    <text class="mono" x="12" y="22" font-size="12" font-weight="700" fill="#c084fc">02 // DSP &amp; MICRO-VAD</text>

    <!-- Flow Steps -->
    <g transform="translate(14, 52)">
      <!-- Step A -->
      <rect x="0" y="0" width="162" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text class="mono" x="10" y="18" font-size="11" font-weight="600" fill="#e5e7eb">Single-Pole IIR Filter</text>
      <text class="mono" x="10" y="32" font-size="9.5" fill="#9ca3af">y[n] = x[n] - x[n-1] + 0.995 y</text>

      <!-- Step B -->
      <rect x="0" y="50" width="162" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text class="mono" x="10" y="68" font-size="11" font-weight="600" fill="#e5e7eb">16KB Rolling VAD Ring</text>
      <text class="mono" x="10" y="82" font-size="9.5" fill="#9ca3af">Adaptive Floor: max(55, 2x noise)</text>

      <!-- Step C -->
      <rect x="0" y="100" width="162" height="42" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text class="mono" x="10" y="118" font-size="11" font-weight="600" fill="#e5e7eb">In-Place 1024 Real FFT</text>
      <text class="mono" x="10" y="132" font-size="9.5" fill="#9ca3af">40ms Hanning • 20ms Stride</text>

      <!-- Step D -->
      <rect x="0" y="150" width="162" height="42" rx="6" fill="#1f2937" stroke="#7c4dff" stroke-width="1" />
      <text class="mono" x="10" y="168" font-size="11" font-weight="600" fill="#c084fc">40-Band Log-Mel + CMN</text>
      <text class="mono" x="10" y="182" font-size="9.5" fill="#e9d5ff">Output Tensor: (1, 49, 40)</text>
    </g>

    <text class="mono" x="95" y="250" text-anchor="middle" font-size="10.5" fill="#a855f7">Processing Time: ~0.94 ms</text>
  </g>

  <!-- Wire 2: DSP -> Neural Network -->
  <path d="M 466 205 L 512 205" fill="none" stroke="#7c4dff" stroke-width="2" class="wire-active" />
  <polygon points="512,201 520,205 512,209" fill="#7c4dff" />

  <!-- ==================== 3. W76 NEURAL INFERENCE ==================== -->
  <g transform="translate(520, 75)">
    <rect width="200" height="265" rx="12" fill="url(#cardGrad)" stroke="#00e676" stroke-width="1.5" />
    
    <rect x="0" y="0" width="200" height="36" rx="12" fill="#065f46" fill-opacity="0.3" />
    <text class="mono" x="12" y="22" font-size="12" font-weight="700" fill="#4ade80">03 // W76 NEURAL NET</text>

    <!-- Network Topology Summary -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="172" height="145" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      
      <text class="mono" x="10" y="20" font-size="10.5" font-weight="700" fill="#f9fafb">Ext_Mel40_StridedStem</text>
      
      <line x1="10" y1="28" x2="162" y2="28" stroke="#374151" stroke-width="1" />

      <text class="mono" x="10" y="44" font-size="9.5" fill="#9ca3af">Conv1 (48, 5x4, stride 2x4)</text>
      <text class="mono" x="10" y="60" font-size="9.5" fill="#9ca3af">B1 DW + PW (48 -&gt; 76)</text>
      <text class="mono" x="10" y="76" font-size="9.5" fill="#00e5ff">Skip Projection: Linear(76,76)</text>
      <text class="mono" x="10" y="92" font-size="9.5" fill="#9ca3af">4x DepthwiseSeparable(76,76)</text>
      <text class="mono" x="10" y="108" font-size="9.5" fill="#9ca3af">GAP + Skip Add (Fused 76)</text>
      <text class="mono" x="10" y="124" font-size="9.5" fill="#4ade80">Classifier: Linear(76, 12)</text>
      <text class="mono" x="10" y="138" font-size="9" fill="#6ee7b7">Softmax Probabilities [12]</text>
    </g>

    <!-- Key Metrics Pill -->
    <g transform="translate(14, 202)">
      <rect x="0" y="0" width="172" height="48" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="1" />
      <text class="mono" x="86" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">3.51 ms Inference @ 240MHz</text>
      <text class="mono" x="86" y="34" text-anchor="middle" font-size="10" fill="#a7f3d0">38,360 Params • 95.0% Acc</text>
    </g>
  </g>

  <!-- Wire 3: Neural Net -> Action & Output -->
  <path d="M 720 205 L 762 205" fill="none" stroke="#00e676" stroke-width="2" class="wire-active" />
  <polygon points="762,201 770,205 762,209" fill="#00e676" />

  <!-- ==================== 4. OLED & PHYSICAL ACTUATION ==================== -->
  <g transform="translate(770, 75)">
    <rect width="158" height="265" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
    
    <rect x="0" y="0" width="158" height="36" rx="12" fill="#78350f" fill-opacity="0.3" />
    <text class="mono" x="10" y="22" font-size="11.5" font-weight="700" fill="#fbbf24">04 // ACTUATION</text>

    <!-- Simulated SSD1306 OLED Display -->
    <g transform="translate(12, 48)">
      <rect width="134" height="76" rx="4" fill="#000000" stroke="#00e5ff" stroke-width="1.5" />
      <text class="mono" x="8" y="16" font-size="9" fill="#ffffff">DETECTED: 95.2%</text>
      <text class="sans" x="8" y="44" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1">GO</text>
      <text class="mono" x="8" y="64" font-size="8.5" fill="#ffffff">Latency: 3.51 ms</text>
    </g>

    <!-- Actuators Output Box -->
    <g transform="translate(12, 134)">
      <!-- LED Indicator -->
      <rect width="134" height="48" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <circle cx="22" cy="24" r="8" fill="#00e676" class="led-glow" />
      <text class="mono" x="38" y="20" font-size="10.5" font-weight="700" fill="#f9fafb">LED (GPIO 2)</text>
      <text class="mono" x="38" y="34" font-size="9" fill="#34d399">ACTIVE [HIGH]</text>

      <!-- Relay / Motor Trigger -->
      <g transform="translate(0, 56)">
        <rect width="134" height="48" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <circle cx="22" cy="24" r="8" fill="#f59e0b" />
        <text class="mono" x="38" y="20" font-size="10.5" font-weight="700" fill="#f9fafb">RELAY (GPIO 4)</text>
        <text class="mono" x="38" y="34" font-size="9" fill="#fbbf24">TRIGGERED [ON]</text>
      </g>
    </g>

    <text class="mono" x="79" y="254" text-anchor="middle" font-size="9.5" fill="#9ca3af">Debounce: 1200 ms</text>
  </g>
</svg>

