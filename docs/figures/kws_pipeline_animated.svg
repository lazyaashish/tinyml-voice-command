<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Animation Keyframes */
    @keyframes pulseWire {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes movingParticle {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    @keyframes liveLedPulse {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 10px #10b981); r: 5px; }
      50% { fill: #38bdf8; filter: drop-shadow(0 0 5px #38bdf8); r: 6.5px; }
    }

    @keyframes soundWaveRings {
      0% { r: 12px; opacity: 0.9; stroke-width: 2.5; }
      50% { opacity: 0.5; }
      100% { r: 38px; opacity: 0; stroke-width: 0.5; }
    }

    @keyframes vu1 { 0%, 100% { height: 8px; y: 44px; } 50% { height: 26px; y: 26px; } }
    @keyframes vu2 { 0%, 100% { height: 16px; y: 36px; } 50% { height: 38px; y: 14px; } }
    @keyframes vu3 { 0%, 100% { height: 24px; y: 28px; } 50% { height: 46px; y: 6px; } }
    @keyframes vu4 { 0%, 100% { height: 14px; y: 38px; } 50% { height: 32px; y: 20px; } }
    @keyframes vu5 { 0%, 100% { height: 20px; y: 32px; } 50% { height: 42px; y: 10px; } }
    @keyframes vu6 { 0%, 100% { height: 10px; y: 42px; } 50% { height: 28px; y: 24px; } }

    @keyframes specHeatmap {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.95; }
    }

    @keyframes oledPulse {
      0%, 100% { border-color: #00f2fe; stroke: #00f2fe; }
      50% { border-color: #10b981; stroke: #10b981; }
    }

    @keyframes neuronPulse {
      0%, 100% { fill: #6366f1; transform: scale(1); }
      50% { fill: #10b981; transform: scale(1.2); }
    }

    .wire-active {
      stroke-dasharray: 8 6;
      animation: pulseWire 1s linear infinite;
    }

    .vu-bar-1 { animation: vu1 0.75s ease-in-out infinite; }
    .vu-bar-2 { animation: vu2 0.55s ease-in-out infinite 0.1s; }
    .vu-bar-3 { animation: vu3 0.65s ease-in-out infinite 0.2s; }
    .vu-bar-4 { animation: vu4 0.85s ease-in-out infinite 0.15s; }
    .vu-bar-5 { animation: vu5 0.5s ease-in-out infinite 0.25s; }
    .vu-bar-6 { animation: vu6 0.7s ease-in-out infinite 0.35s; }

    .led-glow { animation: liveLedPulse 1.8s ease-in-out infinite; }
    .wave-pulse-1 { animation: soundWaveRings 1.6s ease-out infinite; }
    .wave-pulse-2 { animation: soundWaveRings 1.6s ease-out infinite 0.5s; }
    .wave-pulse-3 { animation: soundWaveRings 1.6s ease-out infinite 1.0s; }
    .spec-band { animation: specHeatmap 1.2s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="400" rx="18" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Grid Dots Background Pattern -->
  <g fill="#1e293b" opacity="0.4">
    <circle cx="50" cy="50" r="1.5" /><circle cx="150" cy="50" r="1.5" /><circle cx="250" cy="50" r="1.5" />
    <circle cx="350" cy="50" r="1.5" /><circle cx="450" cy="50" r="1.5" /><circle cx="550" cy="50" r="1.5" />
    <circle cx="650" cy="50" r="1.5" /><circle cx="750" cy="50" r="1.5" /><circle cx="850" cy="50" r="1.5" />
    <circle cx="950" cy="50" r="1.5" /><circle cx="50" cy="350" r="1.5" /><circle cx="150" cy="350" r="1.5" />
    <circle cx="250" cy="350" r="1.5" /><circle cx="350" cy="350" r="1.5" /><circle cx="450" cy="350" r="1.5" />
    <circle cx="550" cy="350" r="1.5" /><circle cx="650" cy="350" r="1.5" /><circle cx="750" cy="350" r="1.5" />
    <circle cx="850" cy="350" r="1.5" /><circle cx="950" cy="350" r="1.5" />
  </g>

  <!-- Title & Subtitle Banner -->
  <g transform="translate(36, 32)">
    <text class="sans" x="0" y="0" font-size="19" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
      ESP32 AUTONOMOUS TINYML KEYWORD SPOTTING PIPELINE
    </text>
    <text class="mono" x="0" y="22" font-size="12" fill="#94a3b8">
      100% Standalone On-Chip Inference • 95.0% Accuracy • 3.51 ms Latency • 0.44% CPU Duty Cycle • Zero Cloud
    </text>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(790, 24)">
    <rect width="174" height="28" rx="14" fill="#0f2942" stroke="#00f2fe" stroke-width="1.2" />
    <circle cx="18" cy="14" r="5" fill="#10b981" class="led-glow" />
    <text class="mono" x="32" y="18" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.3">LIVE 240MHz Xtensa</text>
  </g>

  <!-- ==================== STAGE 1: AUDIO INGESTION ==================== -->
  <g transform="translate(36, 80)">
    <rect width="195" height="285" rx="14" fill="url(#cardGrad)" stroke="#00f2fe" stroke-width="1.6" filter="url(#glowCyan)" />
    
    <!-- Stage Header -->
    <rect x="0" y="0" width="195" height="38" rx="14" fill="#0369a1" fill-opacity="0.3" />
    <text class="mono" x="14" y="24" font-size="12.5" font-weight="700" fill="#00f2fe">01 // AUDIO INGEST</text>

    <!-- INMP441 Microphone Icon & Sound Waves -->
    <g transform="translate(97, 85)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00f2fe" stroke-width="2" class="wave-pulse-1" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="1.5" class="wave-pulse-2" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#7dd3fc" stroke-width="1" class="wave-pulse-3" />
      
      <!-- Mic Head -->
      <circle cx="0" cy="0" r="17" fill="#0f172a" stroke="#00f2fe" stroke-width="2.2" />
      <rect x="-5" y="-8" width="10" height="13" rx="4" fill="#00f2fe" />
      <path d="M -8 -1 A 8 8 0 0 0 8 -1" fill="none" stroke="#00f2fe" stroke-width="1.8" />
      <line x1="0" y1="7" x2="0" y2="12" stroke="#00f2fe" stroke-width="2" />
    </g>

    <!-- Mic Spec Labels -->
    <text class="sans" x="97" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">INMP441 MEMS</text>
    <text class="mono" x="97" y="146" text-anchor="middle" font-size="11" fill="#94a3b8">Digital I2S Microphone</text>

    <!-- Real-time Animated VU Meter -->
    <g transform="translate(24, 160)">
      <rect x="0" y="0" width="147" height="60" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
      <rect x="14" y="44" width="12" height="10" rx="3" fill="#00f2fe" class="vu-bar-1" />
      <rect x="34" y="36" width="12" height="18" rx="3" fill="#38bdf8" class="vu-bar-2" />
      <rect x="54" y="28" width="12" height="26" rx="3" fill="#10b981" class="vu-bar-3" />
      <rect x="74" y="24" width="12" height="30" rx="3" fill="#34d399" class="vu-bar-4" />
      <rect x="94" y="32" width="12" height="22" rx="3" fill="#818cf8" class="vu-bar-5" />
      <rect x="114" y="40" width="12" height="14" rx="3" fill="#a855f7" class="vu-bar-6" />
    </g>

    <text class="mono" x="97" y="244" text-anchor="middle" font-size="10.5" fill="#38bdf8">16 kHz • 24-bit Slot • Mono</text>
    <text class="mono" x="97" y="260" text-anchor="middle" font-size="10" fill="#64748b">SCK=26 • WS=25 • SD=33</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 231 222 L 282 222" fill="none" stroke="#00f2fe" stroke-width="2.5" class="wire-active" />
  <polygon points="282,217 292,222 282,227" fill="#00f2fe" />

  <!-- ==================== STAGE 2: ON-CHIP DSP & SLIDING STREAMING VAD ==================== -->
  <g transform="translate(292, 80)">
    <rect width="210" height="285" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.6" filter="url(#glowPurple)" />
    
    <rect x="0" y="0" width="210" height="38" rx="14" fill="#6b21a8" fill-opacity="0.3" />
    <text class="mono" x="14" y="24" font-size="12.5" font-weight="700" fill="#c084fc">02 // DSP &amp; SLIDING VAD</text>

    <!-- DSP Step Blocks -->
    <g transform="translate(14, 50)">
      <!-- Step 1: IIR DC Filter -->
      <rect x="0" y="0" width="182" height="44" rx="7" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text class="mono" x="10" y="19" font-size="11" font-weight="700" fill="#f1f5f9">IIR DC High-Pass Filter</text>
      <text class="mono" x="10" y="34" font-size="9.5" fill="#94a3b8">y[n] = x[n] - x[n-1] + 0.995 y</text>

      <!-- Step 2: 1.0s Circular Ring Buffer -->
      <rect x="0" y="52" width="182" height="44" rx="7" fill="#131c2e" stroke="#6366f1" stroke-width="1.2" />
      <text class="mono" x="10" y="71" font-size="11" font-weight="700" fill="#a5b4fc">16,000 Ring Buffer (1.0s)</text>
      <text class="mono" x="10" y="86" font-size="9.5" fill="#c7d2fe">Hangover: 288ms Centering Window</text>

      <!-- Step 3: Fast In-Place FFT -->
      <rect x="0" y="104" width="182" height="44" rx="7" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <text class="mono" x="10" y="123" font-size="11" font-weight="700" fill="#f1f5f9">1024-Pt Real FFT (Radix-2)</text>
      <text class="mono" x="10" y="138" font-size="9.5" fill="#94a3b8">40ms Hanning • 20ms Stride • 49 Frames</text>

      <!-- Step 4: 40-Band Log-Mel -->
      <rect x="0" y="156" width="182" height="44" rx="7" fill="#131c2e" stroke="#a855f7" stroke-width="1.2" />
      <text class="mono" x="10" y="175" font-size="11" font-weight="700" fill="#c084fc">40 Log-Mel Spectrogram</text>
      <text class="mono" x="10" y="190" font-size="9.5" fill="#e9d5ff">Energy Scaled [-1.0, 1.0] (No CMN)</text>
    </g>

    <text class="mono" x="105" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#c084fc">DSP Latency: ~0.94 ms</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 502 222 L 546 222" fill="none" stroke="#a855f7" stroke-width="2.5" class="wire-active" />
  <polygon points="546,217 556,222 546,227" fill="#a855f7" />

  <!-- ==================== STAGE 3: W76 NEURAL NETWORK ==================== -->
  <g transform="translate(556, 80)">
    <rect width="215" height="285" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.6" filter="url(#glowGreen)" />
    
    <rect x="0" y="0" width="215" height="38" rx="14" fill="#065f46" fill-opacity="0.3" />
    <text class="mono" x="14" y="24" font-size="12.5" font-weight="700" fill="#34d399">03 // W76 NEURAL NET</text>

    <!-- Architecture Box -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="187" height="152" rx="8" fill="#090d16" stroke="#334155" stroke-width="1" />
      
      <text class="mono" x="12" y="20" font-size="11.5" font-weight="700" fill="#f8fafc">Ext_Mel40_StridedStem_W76</text>
      <line x1="12" y1="28" x2="175" y2="28" stroke="#334155" stroke-width="1" />

      <text class="mono" x="12" y="46" font-size="10" fill="#94a3b8">Conv1 (48 ch, 5x4, stride 2x4)</text>
      <text class="mono" x="12" y="63" font-size="10" fill="#94a3b8">B1 DW + PW (48 -&gt; 76)</text>
      <text class="mono" x="12" y="80" font-size="10" font-weight="700" fill="#38bdf8">Early Skip: Linear(76, 76)</text>
      <text class="mono" x="12" y="97" font-size="10" fill="#94a3b8">4x Residual DW-Blocks (76 ch)</text>
      <text class="mono" x="12" y="114" font-size="10" fill="#94a3b8">GAP + Skip Add (Fused 76)</text>
      <text class="mono" x="12" y="131" font-size="10" font-weight="700" fill="#34d399">Classifier Linear(76, 12)</text>
      <text class="mono" x="12" y="145" font-size="9" fill="#6ee7b7">Softmax 12 Class Probabilities</text>
    </g>

    <!-- Performance Badge -->
    <g transform="translate(14, 210)">
      <rect x="0" y="0" width="187" height="56" rx="8" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1.2" />
      <text class="mono" x="93" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#34d399">3.51 ms Forward Pass</text>
      <text class="mono" x="93" y="38" text-anchor="middle" font-size="10.5" fill="#a7f3d0">38,360 Weights • 95.0% Acc</text>
      <text class="mono" x="93" y="50" text-anchor="middle" font-size="9" fill="#6ee7b7">Zero External Runtime Bloat</text>
    </g>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <path d="M 771 222 L 810 222" fill="none" stroke="#10b981" stroke-width="2.5" class="wire-active" />
  <polygon points="810,217 820,222 810,227" fill="#10b981" />

  <!-- ==================== STAGE 4: OLED & PHYSICAL ACTUATION ==================== -->
  <g transform="translate(820, 80)">
    <rect width="144" height="285" rx="14" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.6" filter="url(#glowAmber)" />
    
    <rect x="0" y="0" width="144" height="38" rx="14" fill="#78350f" fill-opacity="0.3" />
    <text class="mono" x="10" y="24" font-size="12" font-weight="700" fill="#fbbf24">04 // ACTUATION</text>

    <!-- Simulated SSD1306 OLED Display -->
    <g transform="translate(10, 48)">
      <rect width="124" height="78" rx="5" fill="#000000" stroke="#38bdf8" stroke-width="1.6" />
      <text class="mono" x="8" y="16" font-size="9" fill="#38bdf8">DETECTED: 96%</text>
      <text class="sans" x="8" y="46" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">GO</text>
      <text class="mono" x="8" y="66" font-size="8.5" fill="#10b981">Latency: 3.51 ms</text>
    </g>

    <!-- Actuator Indicators -->
    <g transform="translate(10, 138)">
      <!-- LED Indicator -->
      <rect width="124" height="48" rx="7" fill="#131c2e" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="24" r="7" fill="#10b981" class="led-glow" />
      <text class="mono" x="34" y="20" font-size="10.5" font-weight="700" fill="#f8fafc">LED (GPIO 2)</text>
      <text class="mono" x="34" y="34" font-size="9" fill="#34d399">ACTIVE [HIGH]</text>

      <!-- Relay / Motor Trigger -->
      <g transform="translate(0, 56)">
        <rect width="124" height="48" rx="7" fill="#131c2e" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="24" r="7" fill="#f59e0b" />
        <text class="mono" x="34" y="20" font-size="10.5" font-weight="700" fill="#f8fafc">RELAY (GPIO 4)</text>
        <text class="mono" x="34" y="34" font-size="9" fill="#fbbf24">SWITCH [ON]</text>
      </g>
    </g>

    <text class="mono" x="72" y="264" text-anchor="middle" font-size="9.5" fill="#94a3b8">Debounce: 1000 ms</text>
  </g>
</svg>