<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="audioStreamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="centerHighlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
    </linearGradient>

    <filter id="glowCenter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes slideUtterance {
      0% { transform: translateX(0px); }
      35% { transform: translateX(120px); }
      70% { transform: translateX(240px); }
      100% { transform: translateX(0px); }
    }

    @keyframes pulseRingHead {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }

    @keyframes beaconPulse {
      0%, 100% { opacity: 0.2; transform: scaleY(0.9); }
      50% { opacity: 0.9; transform: scaleY(1.05); }
    }

    @keyframes cursorScan {
      0% { x: 80; }
      50% { x: 520; }
      100% { x: 80; }
    }

    @keyframes hopIndicator {
      0%, 100% { opacity: 0.3; fill: #6366f1; }
      50% { opacity: 1; fill: #10b981; }
    }

    .sliding-wave {
      animation: slideUtterance 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .cursor-line {
      animation: cursorScan 5.5s ease-in-out infinite;
    }

    .hop-dot {
      animation: hopIndicator 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="960" height="360" rx="16" fill="url(#bg2)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(32, 28)">
    <text class="sans" x="0" y="0" font-size="17" font-weight="800" fill="#f8fafc">
      REAL-TIME SLIDING STREAMING &amp; CENTERING HANGOVER ENGINE
    </text>
    <text class="mono" x="0" y="20" font-size="11.5" fill="#94a3b8">
      How the 18-Chunk (288 ms) Hangover Rolls Speech to 532 ms Optimal Center for 95.0% 1st-Try Triggering
    </text>
  </g>

  <!-- 1.0s Continuous Buffer Timeline Box -->
  <g transform="translate(32, 70)">
    <rect width="896" height="150" rx="12" fill="url(#boxGrad)" stroke="#475569" stroke-width="1.2" />

    <!-- Optimal Acoustic Center Highlight Region (380ms to 680ms) -->
    <rect x="340" y="10" width="270" height="130" rx="8" fill="url(#centerHighlightGrad)" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" />
    <text class="mono" x="475" y="28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#34d399">
      OPTIMAL ACOUSTIC CENTER (532 ms)
    </text>
    <text class="mono" x="475" y="42" text-anchor="middle" font-size="9" fill="#a7f3d0">
      Peak Model Sensitivity: 95.0% Confidence
    </text>

    <!-- Buffer Time Markers -->
    <line x1="40" y1="95" x2="856" y2="95" stroke="#334155" stroke-width="1.5" />
    
    <circle cx="40" cy="95" r="4" fill="#64748b" />
    <text class="mono" x="40" y="112" text-anchor="middle" font-size="9.5" fill="#94a3b8">0 ms</text>
    <text class="mono" x="40" y="124" text-anchor="middle" font-size="8.5" fill="#64748b">Oldest</text>

    <circle cx="244" cy="95" r="4" fill="#64748b" />
    <text class="mono" x="244" y="112" text-anchor="middle" font-size="9.5" fill="#94a3b8">250 ms</text>

    <circle cx="475" cy="95" r="5" fill="#10b981" />
    <text class="mono" x="475" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981">500 ms</text>
    <text class="mono" x="475" y="124" text-anchor="middle" font-size="8.5" fill="#34d399">Trained Core</text>

    <circle cx="706" cy="95" r="4" fill="#64748b" />
    <text class="mono" x="706" y="112" text-anchor="middle" font-size="9.5" fill="#94a3b8">750 ms</text>

    <circle cx="856" cy="95" r="4" fill="#00f2fe" />
    <text class="mono" x="856" y="112" text-anchor="middle" font-size="9.5" fill="#00f2fe">1000 ms</text>
    <text class="mono" x="856" y="124" text-anchor="middle" font-size="8.5" fill="#38bdf8">Latest / Newest</text>

    <!-- Moving Spoken Utterance Waveform (Animated Sliding Envelope) -->
    <g class="sliding-wave">
      <!-- Utterance "GO" Envelope (Spans ~320ms) -->
      <path d="M 120 95 Q 150 55 180 95 T 220 95 Q 260 40 300 95 Q 340 60 380 95" fill="none" stroke="url(#audioStreamGrad)" stroke-width="3.5" />
      <rect x="180" y="32" width="140" height="22" rx="11" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text class="mono" x="250" y="47" text-anchor="middle" font-size="10" font-weight="700" fill="#c7d2fe">
        UTTERANCE: "GO"
      </text>
    </g>

    <!-- Real-time Sliding Hop Indicators (Every 150ms = 2400 samples) -->
    <g transform="translate(0, 132)">
      <circle cx="244" cy="0" r="3.5" class="hop-dot" />
      <circle cx="360" cy="0" r="3.5" class="hop-dot" style="animation-delay: 0.3s;" />
      <circle cx="475" cy="0" r="4" class="hop-dot" style="animation-delay: 0.6s;" />
      <circle cx="590" cy="0" r="3.5" class="hop-dot" style="animation-delay: 0.9s;" />
      <circle cx="706" cy="0" r="3.5" class="hop-dot" style="animation-delay: 1.2s;" />
      <text class="mono" x="475" y="12" text-anchor="middle" font-size="8.5" fill="#64748b">
        150 ms Evaluation Hops (INFERENCE_HOP_SAMPLES = 2400)
      </text>
    </g>
  </g>

  <!-- Three Architecture Pillars Bottom Grid -->
  <g transform="translate(32, 235)">
    <!-- Card 1: 1st-Try Instant Recognition -->
    <g transform="translate(0, 0)">
      <rect width="285" height="100" rx="10" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.2" />
      <text class="sans" x="14" y="24" font-size="12.5" font-weight="700" fill="#34d399">
        ⚡ 1st-Try Instant Recognition
      </text>
      <text class="mono" x="14" y="44" font-size="10" fill="#94a3b8">
        • Sliding 150 ms evaluation hops
      </text>
      <text class="mono" x="14" y="60" font-size="10" fill="#94a3b8">
        • 288 ms centering hangover window
      </text>
      <text class="mono" x="14" y="76" font-size="10" fill="#10b981">
        • Zero repeating words 3-4 times!
      </text>
    </g>

    <!-- Card 2: 100% True Silence Idle -->
    <g transform="translate(305, 0)">
      <rect width="285" height="100" rx="10" fill="url(#boxGrad)" stroke="#00f2fe" stroke-width="1.2" />
      <text class="sans" x="14" y="24" font-size="12.5" font-weight="700" fill="#38bdf8">
        💤 True Silence Idle Mode
      </text>
      <text class="mono" x="14" y="44" font-size="10" fill="#94a3b8">
        • Speech gate: max(40.0, 1.8x noise)
      </text>
      <text class="mono" x="14" y="60" font-size="10" fill="#94a3b8">
        • Forward pass bypassed in quiet
      </text>
      <text class="mono" x="14" y="76" font-size="10" fill="#00f2fe">
        • 0.1% CPU &amp; zero false triggers
      </text>
    </g>

    <!-- Card 3: Bit-Exact Raw Log-Mel -->
    <g transform="translate(611, 0)">
      <rect width="285" height="100" rx="10" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="1.2" />
      <text class="sans" x="14" y="24" font-size="12.5" font-weight="700" fill="#c084fc">
        🧮 Bit-Exact Audio Normalization
      </text>
      <text class="mono" x="14" y="44" font-size="10" fill="#94a3b8">
        • Normalized / 32768.0 to [-1.0, 1.0]
      </text>
      <text class="mono" x="14" y="60" font-size="10" fill="#94a3b8">
        • Raw energy filterbank (No CMN)
      </text>
      <text class="mono" x="14" y="76" font-size="10" fill="#c084fc">
        • Exact match with 95.0% PyTorch
      </text>
    </g>
  </g>
</svg>